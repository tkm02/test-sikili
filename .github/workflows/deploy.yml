name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 30m
          script: |
            export NEXT_TELEMETRY_DISABLED=1
            set -e
            PROJECT_DIR="$HOME/test-sikili"
            if [ -d "$PROJECT_DIR/.git" ]; then
              cd "$PROJECT_DIR"
              git fetch --all
              git reset --hard origin/main
            else
              # Clone using a repository token stored in GitHub Secrets. Add `REPO_PAT` in Settings → Secrets.
              git clone https://x-access-token:${{ secrets.REPO_PAT }}@github.com/tkm02/test-sikili.git "$PROJECT_DIR"
              cd "$PROJECT_DIR"
            fi

            # Write .env from GitHub Secret (set DOT_ENV in repo Settings → Secrets)
            if [ -n "${{ secrets.DOT_ENV }}" ]; then
              printf '%s' '${{ secrets.DOT_ENV }}' > .env
            fi

            # Build & start
            docker compose pull || true
            docker compose up -d --build

            # Apply DB migrations
            docker compose exec -T app pnpm prisma migrate deploy || true

            # (Optional) Run Odoo test script to validate integration
            docker compose exec -T app pnpm odoo:test || true
